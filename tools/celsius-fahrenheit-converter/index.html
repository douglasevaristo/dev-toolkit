<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Temperature Converter</title>
</head>
<body>
  <h1>Temperature Converter</h1>
  <label for="celsius">Celsius:</label>
  <input type="number" id="celsius" placeholder="°C">
  <button onclick="convertToFahrenheit()">Convert to Fahrenheit</button>
  <p id="fahrenheitResult"></p>
  <label for="fahrenheit">Fahrenheit:</label>
  <input type="number" id="fahrenheit" placeholder="°F">
  <button onclick="convertToCelsius()">Convert to Celsius</button>
  <p id="celsiusResult"></p>
  <script>
    function convertToFahrenheit() {
      var celsius = parseFloat(document.getElementById('celsius').value);
      if (!isNaN(celsius)) {
        var fahrenheit = (celsius * 9/5) + 32;
        document.getElementById('fahrenheitResult').textContent = celsius + ' °C = ' + fahrenheit.toFixed(2) + ' °F';
      }
    }
    function convertToCelsius() {
      var fahrenheit = parseFloat(document.getElementById('fahrenheit').value);
      if (!isNaN(fahrenheit)) {
        var celsius = (fahrenheit - 32) * 5/9;
        document.getElementById('celsiusResult').textContent = fahrenheit + ' °F = ' + celsius.toFixed(2) + ' °C';
      }
    }
  </script>
</body>
</html>
